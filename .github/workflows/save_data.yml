name: Save Brewery Data

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Base64-encoded brewery_data.json content'
        required: true
        type: string
      commit_message:
        description: 'Commit message'
        required: false
        default: 'Brewery scheduler save'
        type: string

jobs:
  save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Decode and write brewery_data.json
        run: |
          echo "${{ github.event.inputs.payload }}" | base64 --decode > brewery_data.json
          echo "brewery_data.json written ($(wc -c < brewery_data.json) bytes)"

      - name: Validate JSON
        run: |
          python3 -c "
          import json, sys
          try:
              with open('brewery_data.json') as f:
                  d = json.load(f)
              beers   = len(d.get('beers', []))
              history = len(d.get('history', []))
              print(f'JSON valid: {beers} beers, {history} history entries')
          except Exception as e:
              print(f'ERROR: invalid JSON — {e}')
              sys.exit(1)
          "

      - name: Commit brewery_data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brewery_data.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "${{ github.event.inputs.commit_message }} $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
